name: Android Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  JAVA_DIST: 'temurin'
  ANDROID_COMPILE_SDK: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'
  GRADLE_VERSION: '8.5'

jobs:
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0
          ndk-version: r27c
          emulator: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
          cache-write-only: true

      - name: Build Debug APK
        id: build_debug
        run: |
          set +e
          gradle --no-daemon --console=plain assembleDebug 2>&1 | tee /tmp/build.log
          BUILD_RC=${PIPESTATUS[0]}
          set -e
          echo "=== Build finished, RC=$BUILD_RC ==="
          if [ $BUILD_RC -ne 0 ]; then
            echo "=== BUILD FAILED. Last 250 lines: ==="
            tail -250 /tmp/build.log
            echo ""
            echo "=== Searching for errors in build log ==="
            grep -in "error\|exception\|fail" /tmp/build.log | head -60 || true
            exit $BUILD_RC
          fi
          echo "=== Last 80 lines ==="
          tail -80 /tmp/build.log
          echo ""
          ls -la app/build/outputs/apk/debug/ 2>/dev/null

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build log if failed
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: /tmp/build.log
          if-no-files-found: ignore
          retention-days: 14